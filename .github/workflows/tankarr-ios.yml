name: Tankarr Reader iOS

on:
  push:
    branches: [main]
    paths:
      - 'App/**'
      - 'AppStore/**'
      - 'Sources/**'
      - 'Tests/**'
      - 'UITests/**'
      - 'Tools/**'
      - 'TankarrReader.xcodeproj/**'
      - 'Package.swift'
      - 'generate_project.py'
      - 'tooling_tests/test_tankarr_ios_*.py'
      - '.github/workflows/tankarr-ios.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Solo verifica, TestFlight oppure invio pubblico della build già provata'
        type: choice
        options: [verify, testflight, submit]
        default: verify
        required: true
      version:
        description: 'Versione X.Y.Z (obbligatoria per submit; altrimenti dal progetto)'
        type: string
        required: false
      build:
        description: 'Build esistente per submit; per TestFlight vuota = prossimo numero Apple'
        type: string
        required: false
      simulator_ui:
        description: 'Esegui anche i test UI nei simulatori (richiede un runtime iOS installato)'
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: tankarr-reader
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  verify:
    name: Core, assets and iOS build
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64, tankarr-reader]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install release tooling without credentials
        run: |
          /opt/homebrew/bin/python3 -m venv "$RUNNER_TEMP/tankarr-ci-venv"
          "$RUNNER_TEMP/tankarr-ci-venv/bin/python" -m pip install requests==2.34.2 cryptography==50.0.2 pytest==9.2.0
          echo "$RUNNER_TEMP/tankarr-ci-venv/bin" >> "$GITHUB_PATH"
      - name: Test release guards
        run: python3 -m pytest tooling_tests/test_tankarr_ios_ci.py tooling_tests/test_tankarr_ios_release.py -q
      - name: Test core and compile iOS without simulator runtimes
        if: ${{ !inputs.simulator_ui }}
        run: python3 Tools/ci_build.py verify-device
      - name: Test application on both simulator device families (opt-in)
        if: ${{ inputs.simulator_ui }}
        run: python3 Tools/ci_build.py verify

  deliver:
    name: TestFlight or explicit App Review submission
    needs: verify
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.action != 'verify'))
    runs-on: [self-hosted, macOS, ARM64, tankarr-reader]
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install release tooling without credentials
        run: |
          /opt/homebrew/bin/python3 -m venv "$RUNNER_TEMP/tankarr-ci-venv"
          "$RUNNER_TEMP/tankarr-ci-venv/bin/python" -m pip install requests==2.34.2 cryptography==50.0.2
          echo "$RUNNER_TEMP/tankarr-ci-venv/bin" >> "$GITHUB_PATH"
      - name: Distribute the tested revision
        env:
          RELEASE_ACTION: ${{ inputs.action || 'testflight' }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD: ${{ inputs.build }}
          ASC_KEY_ID: ${{ vars.TANKARR_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.TANKARR_ASC_ISSUER_ID }}
          ASC_APP_ID: ${{ vars.TANKARR_ASC_APP_ID }}
          ASC_BETA_GROUP_ID: ${{ vars.TANKARR_ASC_BETA_GROUP_ID }}
          APPLE_TEAM_ID: ${{ vars.TANKARR_TEAM_ID }}
          TANKARR_ASC_PRIVATE_KEY: ${{ secrets.TANKARR_ASC_PRIVATE_KEY }}
          TANKARR_DISTRIBUTION_P12_BASE64: ${{ secrets.TANKARR_DISTRIBUTION_P12_BASE64 }}
          TANKARR_DISTRIBUTION_P12_PASSWORD: ${{ secrets.TANKARR_DISTRIBUTION_P12_PASSWORD }}
          TANKARR_PROFILE_BASE64: ${{ secrets.TANKARR_PROFILE_BASE64 }}
        run: python3 Tools/ci_build.py distribute
      - name: Remove temporary signing material
        if: always()
        run: python3 Tools/ci_build.py cleanup
